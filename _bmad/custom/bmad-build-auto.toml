# Project override for bmad-build-auto (merged over the skill's customize.toml).
#
# Why: under bmad-loop, the orchestrator records the baseline as HEAD at session
# start, but step-03 says to capture `baseline_revision` as "current HEAD" at
# implementation time. A session that commits preparatory work first (e.g. a
# refreshed epic context) moves HEAD, the two baselines diverge, and the
# orchestrator's verify gate rejects the finished attempt with
# "spec baseline ... does not match orchestrator-recorded baseline" — pausing
# the whole run on work that actually succeeded (run 20260806-192450-fb15,
# story 6-5-email-ticket-delivery). This activation step pins the baseline to
# session start so prep commits can never desynchronize it.

[workflow]

activation_steps_append = [
  "Record the session baseline immediately: run `git rev-parse HEAD` and keep the full 40-character revision in memory as the session baseline. From now on, wherever this workflow captures or writes `baseline_revision` into spec frontmatter (step-03 phrases it as \"current HEAD\"), write this session-start revision instead. This rule is load-bearing: the run may commit preparatory work (refreshed epic context, planning artifacts) before implementation, and those commits must NOT move the baseline — the bmad-loop orchestrator verifies the spec's `baseline_revision` against the HEAD it recorded when the session started, and any other value fails its gate and discards the finished attempt. If version control is unavailable, use `NO_VCS` as before.",
]
